name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit SHA, not a tag. `v4` is a branch-like
      # ref its owner can repoint at any time, so trusting it means trusting
      # whatever that ref holds on the day a job runs. The comment after each
      # SHA records the release it came from; Dependabot updates both together
      # if it is enabled for github-actions.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      # spec 09 requires schema/tools.json's version to equal package.json's,
      # so a consumer reading the manifest can tell whether it describes the
      # binary they have installed. release.yml enforces this too, but only
      # once a release/* tag exists — and the tag ruleset restricts deleting
      # those, so by then a mismatch is awkward to correct. Checking on every
      # push catches it in the commit that introduced it, which is the whole
      # point: the manifest sat at 0.2.0 through the 0.3.0 and 0.3.1 releases
      # precisely because nothing looked until it was too late to be cheap.
      # No dependencies needed, so this runs before npm ci and fails fast.
      - name: Verify schema/tools.json version matches package.json
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          SCHEMA_VERSION="$(node -p "require('./schema/tools.json').version")"
          echo "package.json=$PKG_VERSION schema/tools.json=$SCHEMA_VERSION"
          if [ "$SCHEMA_VERSION" != "$PKG_VERSION" ]; then
            echo "::error file=schema/tools.json::version $SCHEMA_VERSION does not match package.json $PKG_VERSION — spec 09 requires them to be equal; bump it in the same change"
            exit 1
          fi

      - run: npm ci

      - name: Build (typecheck + emit)
        run: npm run build

      - name: Test
        run: npm test

      - name: Pack check
        run: node scripts/check-pack.mjs
