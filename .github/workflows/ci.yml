name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build (typecheck + emit)
        run: npm run build

      - name: Test
        run: npm test

      - name: Pack check
        run: node scripts/check-pack.mjs
