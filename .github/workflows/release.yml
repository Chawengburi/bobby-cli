name: release

# Publishes ONLY from a `release/<version>` tag — never from a branch push.
# `*` in a tag filter does not cross `/`, so `release/*` matches
# `release/1.0.1` but not `release/1.0.1/anything`.
#
# NOTE: do not add a `branches:` key to this `on.push` block. GitHub treats
# branch and tag filters in the same trigger as OR, which would make every
# branch push try to publish.
on:
  push:
    tags:
      - 'release/*'

permissions:
  contents: read
  # Only needed if `--provenance` is re-enabled below; harmless otherwise.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    # Gate: configure `npm-production` under Settings -> Environments with a
    # required reviewer. Publishing stays a human decision, per the project
    # rule that npm publish is the team lead's call.
    environment: npm-production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Three things must state the same version: the tag being published,
      # package.json, and schema/tools.json.
      #
      # tag <-> package.json: v0.3.0 shipped to npm with no matching git tag,
      # so that published artifact can no longer be traced back to a commit.
      #
      # package.json <-> schema/tools.json: spec 09 requires these to be equal
      # so that any consumer reading the manifest can tell whether it describes
      # the binary they have installed. Nothing enforced it, and the manifest
      # sat at 0.2.0 through both the 0.3.0 and 0.3.1 releases — the exact
      # drift the rule was written in 2026-07-17 to prevent.
      #
      # Both mismatches are reported before failing, so a bad release shows
      # every problem in one run instead of one per attempt. Note this gate
      # only fires once a release/* tag has been pushed, and the tag ruleset
      # restricts deleting those, so a mismatch caught here is awkward to
      # correct; checking the package.json <-> schema pair in ci.yml as well
      # would catch it at push time instead.
      - name: Verify tag, package.json, and schema/tools.json versions agree
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#release/}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          SCHEMA_VERSION="$(node -p "require('./schema/tools.json').version")"
          echo "tag=$TAG_VERSION package.json=$PKG_VERSION schema/tools.json=$SCHEMA_VERSION"
          status=0
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag $TAG_VERSION does not match package.json $PKG_VERSION"
            status=1
          fi
          if [ "$SCHEMA_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::schema/tools.json $SCHEMA_VERSION does not match package.json $PKG_VERSION — spec 09 requires them to be equal; bump it in the same change"
            status=1
          fi
          exit $status

      - run: npm ci

      - run: npm run build

      - run: npm test

      # ci.yml filters on `branches`, which never matches a tag ref — so
      # pushing release/<v> runs this workflow ALONE. The packaging guard has
      # to be repeated here or it would be skipped at the exact moment it
      # matters most: the push that actually uploads to the registry.
      - name: Pack check
        run: node scripts/check-pack.mjs

      # `--provenance` requires a PUBLIC repository. Chawengburi/bobby-cli IS
      # public (an earlier version of this comment claimed it was private and
      # used that to justify omitting the flag — that was wrong, and the same
      # mistaken assumption is why several specs/tickets in this repo were
      # written as if only insiders would read them). The `id-token: write`
      # permission above is what lets npm sign the attestation.
      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
